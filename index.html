  <div class="app-shell" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Report library">
      <div class="sidebar-head">
        <div class="brand">
          <span class="brand-mark"><svg class="icon"><use href="#i-logo"></use></svg></span>
          <span class="brand-text">
            <span class="brand-name">Clouseau</span>
            <span class="brand-sub">Reader</span>
          </span>
          <button class="icon-btn sidebar-close" id="sidebar-close" type="button" aria-label="Close menu"><svg class="icon"><use href="#i-x"></use></svg></button>
        </div>
      </div>

      <div class="sidebar-actions">
        <button class="btn btn-primary btn-block" id="open-files" type="button">
          <svg class="icon"><use href="#i-file-plus"></use></svg> Open JSON
        </button>
        <button class="btn btn-ghost btn-block spotlight-trigger" id="open-search" type="button">
          <svg class="icon"><use href="#i-search"></use></svg>
          <span>Search fields</span>
          <kbd class="spotlight-trigger-key">Ctrl K</kbd>
        </button>
      </div>

      <div class="sidebar-search">
        <svg class="icon search-icon"><use href="#i-search"></use></svg>
        <input class="input input-sm" id="library-search" type="search" placeholder="Filter reports" autocomplete="off" aria-label="Filter reports">
      </div>

      <div class="sidebar-list" id="report-list" role="list" aria-label="Loaded reports"></div>

      <div class="sidebar-foot">
        <label class="switch-row" title="Display URLs and addresses in defanged form">
          <span class="switch-label"><svg class="icon"><use href="#i-shield"></use></svg> Defang values</span>
          <span class="switch">
            <input type="checkbox" id="defang-toggle">
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>
        <div class="sidebar-foot-row">
          <button class="btn btn-ghost btn-sm" id="theme-toggle" type="button">
            <svg class="icon theme-icon"><use href="#i-sun"></use></svg><span id="theme-label">Light theme</span>
          </button>
          <button class="icon-btn" id="clear-library" type="button" aria-label="Clear loaded reports" title="Clear loaded reports">
            <svg class="icon"><use href="#i-trash"></use></svg>
          </button>
        </div>
      </div>
    </aside>

    <div class="workspace" id="workspace">
      <div class="progress-bar" id="progress" hidden><span></span></div>
      <header class="report-header" id="report-header" hidden></header>
      <nav class="tabbar" id="tabbar" aria-label="Report sections" hidden></nav>
      <main class="content" id="main" tabindex="-1"></main>
    </div>
  </div>

  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
  <div class="drop-overlay" id="drop-overlay" hidden>
    <div class="drop-overlay-inner">
      <svg class="icon"><use href="#i-file-plus"></use></svg>
      <strong>Drop a report JSON</strong>
    </div>
  </div>

  <div class="toast-root" id="toast-root" aria-live="polite" aria-atomic="false"></div>
  <div id="modal-root"></div>

  <input class="visually-hidden" type="file" id="files-input" accept=".json,application/json" multiple>
